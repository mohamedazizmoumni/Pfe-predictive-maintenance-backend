version: "3.9"

services:
  python-ml:
    image: python:3.11-slim
    working_dir: /ml
    volumes:
      - ${ML_SERVICE_DIR:-../python-ml-service}:/ml
    command: >
      sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"

  backend:
    build:
      context: .
      dockerfile: api-module/Dockerfile
    environment:
      ML_SERVICE_BASE_URL: http://python-ml:8000
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - python-ml
    ports:
      - "8080:8080"

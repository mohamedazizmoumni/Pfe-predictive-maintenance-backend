spring:
  application:
    name: predictive-maintenance-backend
    version: 1.0.0

  datasource:
    url: jdbc:postgresql://localhost:5432/pfe
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      test-on-borrow: true
      validation-query: "SELECT 1"
      validation-interval: 30000

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          fetch-size: 50
          batch-size: 10
          use-scrollable-result-set: false
        order-inserts: true
        order-updates: true
        use_versioned-lob: true
        batch-versioned-data: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    clean-on-validation-error: true
    baseline-on-migrate: false
    placeholders:
      schema: public
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false


logging:
  level:
    root: INFO
    com.pfe.predictive: DEBUG
    com.pfe.predictive.api: INFO
    com.pfe.predictive.core: DEBUG
    com.pfe.predictive.data: DEBUG
    com.pfe.predictive.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
    org.springframework.data: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [corr:%X{correlationId:-} req:%X{requestId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [corr:%X{correlationId:-} req:%X{requestId:-}] - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true

# ============================================================================
# ACTUATOR / HEALTH CHECK CONFIGURATION
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,diskSpace,pythonMl
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ============================================================================
# PAGINATION & API DEFAULTS
# ============================================================================
pagination:
  default-page-size: 20
  max-page-size: 100

# ============================================================================
# SECURITY (JWT) CONFIGURATION - UPDATED
# ============================================================================
jwt:
  # Access token: 1 hour (3600000 ms)
  secret: your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long-minimum-32-characters
  expiration: 3600000
  # Refresh token: 7 days (604800000 ms)
  refresh:
    expiration: 604800000

security:
  # Keep backward compatibility
  jwt:
    secret: your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long-minimum-32-characters
    expiration: 3600000
    refresh-expiration: 604800000

# ============================================================================
# CORS CONFIGURATION (IMPORTANT FOR ANGULAR)
# ============================================================================
cors:
  allowed-origins: http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
  exposed-headers: Authorization,Content-Type
  allow-credentials: true
  max-age: 3600

# ============================================================================
# SPECIFIC MODULE CONFIGURATIONS
# ============================================================================

# Alert Module Settings
alert:
  bulk-operation-limit: 1000
  notifications:
    enabled: false
    critical-alert-recipients: admin@example.com
  aging:
    days-to-close: 90
    days-to-archive: 365

# Machine Module Settings
machine:
  sensor-data-retention-days: 365
  anomaly-detection-threshold: 0.8

# Maintenance Module Settings
maintenance:
  days-overdue-threshold: 7
  auto-escalation-enabled: false

# Prediction Module Settings
prediction:
  min-confidence-threshold: 0.5
  model-evaluation-enabled: true

predictive:
  maintenance:
    schedule-ms: ${PREDICTIVE_MAINTENANCE_SCHEDULE_MS:5000}
    failure-threshold: ${PREDICTIVE_FAILURE_THRESHOLD:0.7}
    report-cooldown-minutes: ${PREDICTIVE_REPORT_COOLDOWN_MINUTES:60}

# Inventory Module Settings
inventory:
  low-stock-threshold-percentage: 20
  reorder-lead-time-days: 5

# ============================================================================
# CHATBOT / OPENAI CONFIGURATION
# ============================================================================
openai:
  api:
    # Do not hardcode secrets. Set OPENAI_API_KEY in your environment.
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini

chatbot:
  timeout-seconds: 30
  ollama:
    enabled: true
    api-url: http://127.0.0.1:11434/api/chat
    model: tinyllama

# ============================================================================
# PYTHON ML SERVICE INTEGRATION
# ============================================================================
ml:
  # Internal API key for securing calls to FastAPI microservices
  internal-api-key: ${ML_INTERNAL_API_KEY:sentinel-dev-secret}
  
  # Predictive maintenance service (port 5000)
  predictive:
    url: ${ML_PREDICTIVE_URL:http://localhost:5000}
  
  # Face recognition service (port 5001)
  face:
    url: ${ML_FACE_URL:http://localhost:5001}
  
  service:
    base-url: ${ML_SERVICE_BASE_URL:http://127.0.0.1:8000}
    expected-feature-count: 89
    correlation-header: X-Correlation-ID
    timeout:
      connect: ${ML_SERVICE_CONNECT_TIMEOUT:2s}
      read: ${ML_SERVICE_READ_TIMEOUT:5s}
    retry:
      max-attempts: ${ML_SERVICE_RETRY_MAX_ATTEMPTS:3}
      backoff: ${ML_SERVICE_RETRY_BACKOFF:200ms}
    auth:
      header-name: ${ML_SERVICE_AUTH_HEADER_NAME:}
      header-value: ${ML_SERVICE_AUTH_HEADER_VALUE:}
  rate-limit:
    enabled: ${ML_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${ML_RATE_LIMIT_RPM:60}

# ============================================================================
# FACE LOGIN SERVICE INTEGRATION
# ============================================================================
face-login:
  service:
    base-url: ${FACE_LOGIN_SERVICE_BASE_URL:http://localhost:5001}
    recognize-path: ${FACE_LOGIN_RECOGNIZE_PATH:/recognize}
    enroll-path: ${FACE_LOGIN_ENROLL_PATH:/enroll}
    image-field-name: ${FACE_LOGIN_IMAGE_FIELD_NAME:image}
    timeout:
      connect: ${FACE_LOGIN_CONNECT_TIMEOUT:2s}
      read: ${FACE_LOGIN_READ_TIMEOUT:8s}
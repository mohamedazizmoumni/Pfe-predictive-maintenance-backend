spring:
  application:
    name: predictive-maintenance-backend
    version: 1.0.0

  # ============================================================================
  # DATABASE
  # ============================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/pfe
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: true
      pool-name: PredictiveHikariPool

  # ============================================================================
  # JPA / HIBERNATE
  # ============================================================================
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # ============================================================================
  # FLYWAY
  # ============================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # ============================================================================
  # FILE UPLOAD
  # ============================================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ============================================================================
  # JACKSON
  # ============================================================================
  jackson:
    default-property-inclusion: non_null

    serialization:
      write-dates-as-timestamps: false
      indent-output: true

    deserialization:
      fail-on-unknown-properties: false

  # ============================================================================
  # GMAIL SMTP CONFIGURATION
  # ============================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: mohamedaziz.moumni@esprit.tn
    password: hmux zqbh axin wyuw

    protocol: smtp

    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: smtp.gmail.com

app:
  frontend-url: http://localhost:4200

  mail:
    enabled: true
    from: mohamedaziz.moumni@esprit.tn

    task:
      enabled: true

    alert:
      enabled: true

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level:
    root: INFO

    # Application logs
    com.pfe.predictive: DEBUG

    # Email logs
    org.springframework.mail: DEBUG
    org.springframework.mail.javamail: DEBUG
    jakarta.mail: DEBUG
    javax.mail: DEBUG

    # SQL logs
    org.hibernate.SQL: DEBUG

    # Security logs
    org.springframework.security: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/application.log

# ============================================================================
# SERVER
# ============================================================================
server:
  port: 8080

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

  compression:
    enabled: true

# ============================================================================
# MANAGEMENT
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

# ============================================================================
# JWT
# ============================================================================
jwt:
  secret: your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long-minimum-32-characters

  expiration: 3600000

  refresh:
    expiration: 604800000

# ============================================================================
# SECURITY
# ============================================================================
security:
  jwt:
    secret: your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long-minimum-32-characters

    expiration: 3600000

    refresh-expiration: 604800000

# ============================================================================
# CORS
# ============================================================================
cors:
  allowed-origins:
    - http://localhost:4200
    - http://127.0.0.1:4200
    - http://localhost:3000

  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH

  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin

  exposed-headers:
    - Authorization
    - Content-Type

  allow-credentials: true

# ============================================================================
# ALERT SETTINGS
# ============================================================================
alert:
  bulk-operation-limit: 1000

  notifications:
    enabled: true

    critical-alert-recipients:
      - mohamedaziz.moumni@gmail.com

  aging:
    days-to-close: 90
    days-to-archive: 365

# ============================================================================
# MACHINE SETTINGS
# ============================================================================
machine:
  sensor-data-retention-days: 365
  anomaly-detection-threshold: 0.8

# ============================================================================
# MAINTENANCE SETTINGS
# ============================================================================
maintenance:
  days-overdue-threshold: 7
  auto-escalation-enabled: false

# ============================================================================
# PREDICTION SETTINGS
# ============================================================================
prediction:
  min-confidence-threshold: 0.5
  model-evaluation-enabled: true

# ============================================================================
# NLP SERVICE
# ============================================================================
nlp:
  service:
    url: http://localhost:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

# ============================================================================
# TELEMETRY
# ============================================================================
telemetry:
  replay:
    enabled: true
    tick-interval-ms: 2000
    default-speed: 1.0

# ============================================================================
# INVENTORY
# ============================================================================
inventory:
  low-stock-threshold-percentage: 20
  reorder-lead-time-days: 5

# ============================================================================
# OPENAI
# ============================================================================
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions

  model: gpt-4o-mini

# ============================================================================
# CHATBOT
# ============================================================================
chatbot:
  timeout-seconds: 30

  ollama:
    enabled: true
    api-url: http://127.0.0.1:11434/api/chat
    model: tinyllama

# ============================================================================
# ML SERVICES
# ============================================================================
ml:
  internal-api-key: sentinel-dev-secret

  predictive:
    url: http://localhost:5000

  face:
    url: http://localhost:5001

# ============================================================================
# FACE LOGIN
# ============================================================================
face-login:
  service:
    base-url: http://localhost:5001
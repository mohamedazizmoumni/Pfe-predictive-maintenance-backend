spring:
  application:
    name: predictive-maintenance-backend
    version: 1.0.0

  # No SPRING_PROFILES_ACTIVE set -> defaults to dev, matching the verbose
  # local-dev behavior this app has always had. Set SPRING_PROFILES_ACTIVE=prod
  # for a deployment (see application-prod.yml) - only that profile is meant to
  # run against a real database.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ============================================================================
  # DATABASE
  # ============================================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pfe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: true
      pool-name: PredictiveHikariPool

  # ============================================================================
  # JPA / HIBERNATE
  # ============================================================================
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # ============================================================================
  # FLYWAY
  # ============================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # ============================================================================
  # FILE UPLOAD
  # ============================================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ============================================================================
  # JACKSON
  # ============================================================================
  jackson:
    default-property-inclusion: non_null

    serialization:
      write-dates-as-timestamps: false
      indent-output: true

    deserialization:
      fail-on-unknown-properties: false

  # ============================================================================
  # GMAIL SMTP CONFIGURATION
  # ============================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    protocol: smtp

    properties:
      mail:
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: smtp.gmail.com

app:
  frontend-url: http://localhost:4200

  # Demo/sample data seeding (users incl. admin, machines, finance, inventory).
  # Off by default so an empty production database never gets seeded with
  # predictable credentials. Set SEED_DEMO_DATA=true for local dev/demo.
  demo-data:
    enabled: ${SEED_DEMO_DATA:false}

  mail:
    enabled: true
    from: mohamedaziz.moumni@esprit.tn
    from-name: Sentinel Predictive Maintenance
    # Where visitor-submitted contact/demo inquiries from the public
    # marketing site get emailed. Falls back to every ADMIN/SUPER_ADMIN's
    # own address (same as alert emails) when unset.
    contact-inbox: ${CONTACT_INBOX_EMAIL:maziz5802@gmail.com}

    task:
      enabled: true

    alert:
      enabled: true

# ============================================================================
# LOGGING (INFO-level safe default; application-dev.yml adds verbosity)
# ============================================================================
logging:
  level:
    root: INFO
    com.pfe.predictive: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/application.log

# ============================================================================
# SERVER
# ============================================================================
server:
  port: 8080

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

  compression:
    enabled: true

# ============================================================================
# MANAGEMENT
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      # Exposes /actuator/health/liveness and /actuator/health/readiness,
      # which by default only aggregate Spring's built-in liveness/readiness
      # state — NOT custom indicators like the pythonMl one. That indicator
      # calls out to the ML service with retries/backoff; if it's slow or
      # unreachable, that can stall the *aggregate* /actuator/health for
      # well over a minute even though the app itself is fully up. Infra
      # health checks (load balancers, CI smoke tests, k8s probes) should
      # hit /actuator/health/liveness instead, which reflects "is the app
      # itself alive" independent of downstream integration health.
      probes:
        enabled: true

# ============================================================================
# JWT
# ============================================================================
# JWT_SECRET must be set via .env / environment — no insecure fallback here.
# JwtTokenProvider fails startup if it's missing or matches a known placeholder.
jwt:
  secret: ${JWT_SECRET:}

  expiration: 3600000

  refresh:
    expiration: 604800000

# ============================================================================
# CORS
# ============================================================================
cors:
  allowed-origins:
    - http://localhost:4200
    - http://127.0.0.1:4200
    - http://localhost:3000
    # Marketing site (sentinel-client side) dev server
    - http://localhost:4300
    - http://127.0.0.1:4300

  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH

  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin

  exposed-headers:
    - Authorization
    - Content-Type

  allow-credentials: true

# ============================================================================
# ALERT SETTINGS
# ============================================================================
alert:
  bulk-operation-limit: 1000

  notifications:
    enabled: true

    # Not currently read anywhere (AlertNotificationProperties.criticalAlertRecipients
    # has no caller — real alert emails go to users with MANAGER/ADMIN/SUPER_ADMIN
    # roles instead, see EmailService.ALERT_RECIPIENT_ROLES). Left empty rather
    # than hardcoding a personal address in a tracked file for no functional reason.
    critical-alert-recipients: []

  aging:
    days-to-close: 90
    days-to-archive: 365

# ============================================================================
# MACHINE SETTINGS
# ============================================================================
machine:
  sensor-data-retention-days: 365
  anomaly-detection-threshold: 0.8

# ============================================================================
# MAINTENANCE SETTINGS
# ============================================================================
maintenance:
  days-overdue-threshold: 7
  auto-escalation-enabled: false
  # How often MaintenanceEscalationScheduler checks for overdue work orders (ms).
  # Only matters once auto-escalation-enabled is true.
  escalation-check-interval-ms: 3600000
  # Default recurrence used to set Machine.nextMaintenanceDate when a rapport
  # gets final approval, until a real MaintenanceTemplate entity exists.
  default-recurrence-days: 90

# ============================================================================
# PREDICTION SETTINGS
# ============================================================================
prediction:
  min-confidence-threshold: 0.5
  model-evaluation-enabled: true

# ============================================================================
# NLP SERVICE
# ============================================================================
nlp:
  service:
    url: ${NLP_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

# ============================================================================
# TELEMETRY
# ============================================================================
telemetry:
  replay:
    enabled: true
    tick-interval-ms: 5000
    default-speed: 1.0
    # Points at the real NASA C-MAPSS train_FD001.txt (etc.) shipped in the
    # ml_service repo's data/ folder. Empty by default - telemetry replay
    # stays idle (logged as a warning, not an error) until this is set.
    # Comma-separate multiple resources; Spring Resource syntax (file:, classpath:).
    dataset-resources: ${TELEMETRY_DATASET_RESOURCES:}

# ============================================================================
# INVENTORY
# ============================================================================
inventory:
  low-stock-threshold-percentage: 20
  reorder-lead-time-days: 5
  auto-reorder-enabled: false
  # How often AutoReorderScheduler checks for parts below the reorder trigger (ms).
  # Only matters once auto-reorder-enabled is true.
  auto-reorder-check-interval-ms: 3600000

# ============================================================================
# OPENAI
# ============================================================================
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions

  model: gpt-4o-mini

# ============================================================================
# CHATBOT
# ============================================================================
chatbot:
  timeout-seconds: 30

  ollama:
    enabled: true
    api-url: http://127.0.0.1:11434/api/chat
    model: tinyllama

# ============================================================================
# ML SERVICES
# ============================================================================
ml:
  internal-api-key: ${ML_INTERNAL_API_KEY:sentinel-dev-secret}

  predictive:
    url: ${ML_PREDICTIVE_URL:http://localhost:8000}

  face:
    url: ${ML_FACE_URL:http://localhost:8000}

  # ml.service.* backs MlServiceProperties (PythonMlClient / RestClient-based on-demand /ml/predict path).
  # Without this block, PythonMlClient sends no auth header and every call 401s against ml_service's
  # require_internal_key middleware — same root cause as the MLServiceClient fix above, different client.
  service:
    base-url: ${ML_PREDICTIVE_URL:http://localhost:8000}
    auth:
      header-name: X-Internal-Key
      header-value: ${ml.internal-api-key}

# ============================================================================
# FACE LOGIN
# ============================================================================
face-login:
  service:
    base-url: ${ML_FACE_URL:http://localhost:8000}
    recognize-path: /face/recognize
    enroll-path: /face/enroll